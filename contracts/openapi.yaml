            application/json:
              schema:
                $ref: '#/components/schemas/PlanProposal'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /experiments/{experiment_id}/approvals:
    post:
      tags:
      - Approvals
      operationId: approvePlan
      description: Requires appropriate approval permission and safety policy.
      parameters:
      - $ref: '#/components/parameters/ExperimentId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '201':
