          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetManifest'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
