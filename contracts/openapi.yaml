        schema_version:
          const: '2.0'
        policy_versions:
          type: object
          minProperties: 1
          propertyNames:
            type: string
            minLength: 1
          additionalProperties:
            type: string
            minLength: 1
        capability_versions:
          type: object
          minProperties: 1
          propertyNames:
            type: string
            minLength: 1
          additionalProperties:
            type: string
            minLength: 1
