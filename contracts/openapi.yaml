        proposal_id:
          type: string
          minLength: 1
        experiment_id:
          type: string
          minLength: 1
        source_agent_run_id:
          type: string
          minLength: 1
        based_on_snapshot_version:
          type: integer
          minimum: 0
        requested_resources:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/PlanTask'
          minItems: 1
        reason:
          type: string
          minLength: 1
        risk_level:
          enum:
          - read_only
          - low_risk_write
          - operator_review
          - high_risk
        evidence_dataset_ids:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        plan_revision_id:
          type: string
          minLength: 1
        plan_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        state:
          enum:
          - PROPOSED
          - VALIDATED
          - REJECTED
          - AWAITING_APPROVAL
      allOf:
      - if:
          properties:
            state:
              enum:
              - VALIDATED
              - AWAITING_APPROVAL
        then:
          required:
          - plan_revision_id
          - plan_hash
    DatasetManifest:
      title: ALAP dataset_manifest v2
      type: object
      additionalProperties: false
      required:
      - dataset_id
      - experiment_id
      - run_id
      - task_id
      - instrument_ids
      - acquisition_interval
      - data_format
      - storage_uri
      - checksum_sha256
      - unit_map
      - status
      - schema_version
      - policy_versions
      - capability_versions
      - device_snapshot_version
      properties:
        dataset_id:
          type: string
          minLength: 1
        experiment_id:
          type: string
          minLength: 1
        run_id:
          type: string
          minLength: 1
        task_id:
          type: string
          minLength: 1
        instrument_ids:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        acquisition_interval:
          type: object
          additionalProperties: false
          required:
          - start_utc
          - end_utc
          properties:
            start_utc:
              type: string
              format: date-time
            end_utc:
              type: string
              format: date-time
        data_format:
          type: string
          enum:
          - hdf5
          - zarr
        storage_uri:
          type: string
          minLength: 1
        checksum_sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        unit_map:
          type: object
          additionalProperties:
            type: string
        status:
          const: COMMITTED
        device_snapshot_version:
          type: integer
          minimum: 0
        schema_version:
          const: '2.0'
        policy_versions:
          type: object
          minProperties: 1
          propertyNames:
            type: string
            minLength: 1
          additionalProperties:
            type: string
            minLength: 1
        capability_versions:
          type: object
          minProperties: 1
          propertyNames:
            type: string
            minLength: 1
          additionalProperties:
            type: string
            minLength: 1
