openapi: 3.1.0
info:
  title: ALAP Web & Experiment API
  version: 3.1.0-development
  description: D09 authenticated application API. Local opaque bearer tokens; no public
    hardware dispatch. Contract source for runtime request validation.
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Experiments
- name: Approvals
- name: Runs
- name: Instruments
- name: Datasets
paths:
  /experiments:
    post:
      tags:
      - Experiments
      operationId: createExperiment
      summary: Create an experiment without controlling hardware
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreate'
      responses:
        '201':
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Experiments
      operationId: listExperiments
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Authorized experiments
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experiment'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /experiments/{experiment_id}:
    get:
      tags:
      - Experiments
      operationId: getExperiment
      parameters:
      - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: Authoritative experiment snapshot; revision is for concurrency
            control
          headers:
            ETag:
              description: Revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /experiments/{experiment_id}/proposals:
    post:
      operationId: createProposal
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - &id001
        $ref: '#/components/parameters/IdempotencyKey'
      - &id002
        $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema: &id003
                type: object
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRevision'
  /experiments/{experiment_id}/approvals:
    post:
      operationId: approvePlan
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      - *id002
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approval_id:
                  type: string
                  minLength: 1
                  maxLength: 200
                decision:
                  enum:
                  - approve
                  - reject
                  - revoke
                state_version: &id008
                  type: integer
                  minimum: 0
              required:
              - approval_id
              - decision
              - state_version
  /experiments/{experiment_id}/runs:
    post:
      operationId: startRun
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      - *id002
      responses:
        '202':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                approval_id:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
              - approval_id
  /runs/{run_id}/actions:
    post:
      operationId: requestRunAction
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action:
                  enum:
                  - pause
                  - resume
                  - cancel
              required:
              - action
  /experiments/{experiment_id}/events:
    get:
      tags:
      - Experiments
      operationId: streamExperimentEvents
      description: SSE id is experiment_seq, never aggregate_seq. Snapshot event_cursor
        and state are read atomically. Expired cursor returns RESYNC_REQUIRED.
      parameters:
      - $ref: '#/components/parameters/ExperimentId'
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /instruments:
    get:
      tags:
      - Instruments
      operationId: listInstruments
      responses:
        '200':
          description: Instruments visible to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /instruments/{instrument_id}:
    get:
      tags:
      - Instruments
      operationId: getInstrument
      parameters:
      - name: instrument_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Instrument metadata and stale-aware status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /datasets/{dataset_id}:
    get:
      tags:
      - Datasets
      operationId: getDatasetManifest
      parameters:
      - name: dataset_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Authorized committed dataset metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetManifest'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /experiments/{experiment_id}/approval-requests:
    post:
      operationId: requestApproval
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      - *id002
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plan_revision_id:
                  type: string
                  minLength: 1
                  maxLength: 200
                plan_hash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                expires_at:
                  type: string
                  format: date-time
              required:
              - plan_revision_id
              - plan_hash
              - expires_at
  /experiments/{experiment_id}/snapshot:
    get:
      operationId: getSnapshot
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSnapshot'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      parameters: []
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdentity'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /samples:
    post:
      operationId: createSample
      parameters:
      - *id001
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 200
                metadata:
                  type: object
                  maxProperties: 30
              required:
              - id
              - metadata
    get:
      operationId: listSamples
      parameters: []
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /experiments/{experiment_id}/members/{actor_id}:
    put:
      operationId: updateMembership
      parameters:
      - name: experiment_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: actor_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      - *id002
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role:
                  enum:
                  - observer
                  - operator
                  - approver
                scope: &id009
                  type: object
                  additionalProperties: false
                  properties:
                    resources:
                      type: array
                      items:
                        type: string
                        minLength: 1
                        maxLength: 200
                      uniqueItems: true
                      maxItems: 100
                    risk_levels:
                      type: array
                      items:
                        enum:
                        - read_only
                        - low_risk_write
                        - operator_review
                        - high_risk
                      uniqueItems: true
                  required:
                  - resources
                  - risk_levels
                revoked:
                  type: boolean
              required:
              - role
              - scope
              - revoked
  /skills:
    get:
      operationId: listSkills
      parameters:
      - &id004
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - &id005
        name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: importSkill
      parameters:
      - *id001
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillManifest'
  /skills/{ref}/publish:
    post:
      operationId: publishSkill
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /skills/{ref}/disable:
    post:
      operationId: disableSkill
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /agents:
    get:
      operationId: listAgents
      parameters:
      - *id004
      - *id005
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: importAgent
      parameters:
      - *id001
      responses:
        '201':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfig'
  /agents/{ref}/publish:
    post:
      operationId: publishAgent
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - *id001
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema: *id003
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
