components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Required experiment snapshot revision ETag; plan ID and hash are
        checked independently.
  responses:
    Error:
      description: Error response; sensitive policy details must not leak to unauthorized
        users
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          - retryable
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
    ExperimentCreate:
      type: object
      additionalProperties: false
      required:
      - title
      - sample_id
      - objective
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        sample_id:
          type: string
          minLength: 1
        objective:
          type: string
          minLength: 1
          maxLength: 4000
    Experiment:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      - revision
      - created_at
      - event_cursor
      properties:
        id:
          type: string
        state:
          type: string
          enum:
          - DRAFT
          - PLANNING
          - READY
          - RUNNING
          - PAUSED
          - COMPLETED
          - FAILED
          - NEEDS_ATTENTION
          - ARCHIVED
          - PLANNED
        title:
          type: string
        sample_id:
          type: string
        objective:
          type: string
        revision:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        event_cursor:
          type: integer
          minimum: 0
    ApprovalRequest:
      type: object
      additionalProperties: false
      required:
      - plan_revision_id
      - plan_hash
      - decision
      properties:
        plan_revision_id:
          type: string
        plan_hash:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
    Approval:
      type: object
      additionalProperties: false
      required:
      - approval_id
      - plan_revision_id
      - plan_hash
      - state
      - decided_at
      - state_version
      properties:
        approval_id:
          type: string
        plan_revision_id:
          type: string
        plan_hash:
          type: string
        state:
          $ref: '#/components/schemas/LifecycleRecord/$defs/ApprovalState'
        decided_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        state_version:
          type: integer
          minimum: 0
    Run:
      type: object
      additionalProperties: false
      required:
      - run_id
      - experiment_id
      - plan_revision_id
      - state
      - state_version
      properties:
        run_id:
          type: string
        experiment_id:
          type: string
        plan_revision_id:
          type: string
        state:
          $ref: '#/components/schemas/LifecycleRecord/$defs/RunState'
        state_version:
          type: integer
          minimum: 0
    Instrument:
      type: object
      additionalProperties: false
      required:
      - instrument_id
      - gateway_id
      - status
      - observed_at
      properties:
        instrument_id:
          type: string
        gateway_id:
          type: string
        status:
          type: string
          enum:
          - ONLINE
          - STALE
          - OFFLINE
          - FAULT
          - INTERLOCKED
          - UNKNOWN
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: object
          additionalProperties: true
        capability_version:
          type: string
        id:
          type: string
          minLength: 1
          maxLength: 200
    AgentConfig:
      type: object
      additionalProperties: false
      properties:
        manifest:
          $ref: '#/components/schemas/AgentManifest'
        token_budget:
          type: integer
          minimum: 1
          maximum: 1000000
        context_bytes:
          type: integer
          minimum: 1
          maximum: 1000000
        max_tool_calls:
          type: integer
          minimum: 1
          maximum: 1000000
      required:
      - manifest
      - token_budget
      - context_bytes
      - max_tool_calls
    SessionIdentity:
      type: object
      additionalProperties: false
      properties:
        id: &id010
          type: string
        kind: *id010
        role: *id010
      required:
      - id
      - kind
      - role
    WorkspaceSnapshot:
      type: object
      additionalProperties: false
      properties:
        experiment:
          $ref: '#/components/schemas/Experiment'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanRevision'
        plan_summaries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id010
              plan_hash: *id010
              revision: &id012
                type: integer
                minimum: 0
            required:
            - id
