[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alap"
version = "0.1.0"
description = "Autonomous Laboratory Agent Platform — domain and contract foundation"
requires-python = ">=3.14,<3.15"
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0", "rfc3339-validator==0.1.4", "psycopg[binary]==3.3.6", "h5py==3.16.0", "numpy==2.5.4", "nats-py==2.16.0", "langgraph==1.2.16", "fastapi==0.144.0", "uvicorn==0.54.0", "cryptography==50.0.2", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["PyYAML==6.0.3", "pytest==9.1.1", "ruff==0.17.1", "openapi-spec-validator==0.9.0", "alembic==1.20.0", "SQLAlchemy==2.1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["postgres: real PostgreSQL integration tests (ALAP_TEST_DATABASE_URL required)"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
